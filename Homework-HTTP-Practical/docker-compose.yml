services:
  httpbin:
    image: ghcr.io/mccutchen/go-httpbin:latest
    expose:
      - "8080"
    networks:
      - backend

  proxy:
    build: ./proxy
    ports:
      - "80:3000"
    environment:
      PORT: "3000"
      TARGET_HOST: httpbin
      TARGET_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      LOGIN_USER: ${LOGIN_USER:?Set LOGIN_USER in .env}
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:?Set LOGIN_PASSWORD in .env}
    depends_on:
      - httpbin
    networks:
      - frontend
      - backend

networks:
  frontend:
  backend:
    internal: true